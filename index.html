<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Космическая открытка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --c: #a78bfa; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; font-family: "Exo 2", sans-serif; color: #e8e6ff;
      background:
        radial-gradient(ellipse at 20% 10%, color-mix(in srgb, var(--c) 30%, transparent), transparent 55%),
        radial-gradient(ellipse at 85% 90%, rgba(56, 189, 248, .22), transparent 50%),
        radial-gradient(ellipse at 50% 50%, #0b0b2b, #02020a 80%);
      overflow-x: hidden;
    }
    #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

    /* планета с кольцом */
    .planet {
      position: fixed; right: -60px; top: 8vh; width: 220px; height: 220px; border-radius: 50%; z-index: 0;
      background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--c) 60%, #fff), var(--c) 40%, color-mix(in srgb, var(--c) 30%, #000) 75%);
      box-shadow: 0 0 80px color-mix(in srgb, var(--c) 50%, transparent), inset -30px -20px 60px rgba(0,0,0,.6);
      animation: drift 18s ease-in-out infinite;
    }
    .planet::after {
      content: ""; position: absolute; left: -45%; top: 42%; width: 190%; height: 16%;
      border-radius: 50%; border: 6px solid rgba(255,255,255,.35); transform: rotate(-18deg);
    }
    .moon {
      position: fixed; left: 6vw; bottom: 10vh; width: 70px; height: 70px; border-radius: 50%; z-index: 0;
      background: radial-gradient(circle at 35% 35%, #f5f5f5, #9ca3af 60%, #4b5563);
      box-shadow: 0 0 30px rgba(255,255,255,.25); animation: drift 12s ease-in-out infinite reverse;
    }
    @keyframes drift { 50% { transform: translate(-12px, 14px); } }

    .card {
      position: relative; z-index: 1; width: min(480px, 100%);
      padding: 40px 28px 32px; text-align: center; border-radius: 28px;
      background: rgba(15, 15, 45, .55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
      box-shadow: 0 0 40px color-mix(in srgb, var(--c) 35%, transparent), inset 0 0 30px rgba(255,255,255,.04);
      display: none;
    }
    .card.show { display: block; animation: warp .9s cubic-bezier(.2,1.2,.4,1) both; }
    @keyframes warp { from { transform: scale(.2) translateY(60px); opacity: 0; filter: blur(8px); } }
    .emoji { font-size: 64px; line-height: 1; animation: fly 3s ease-in-out infinite; filter: drop-shadow(0 0 12px var(--c)); }
    @keyframes fly { 50% { transform: translateY(-10px) rotate(-8deg); } }
    h1 {
      font-family: "Russo One", sans-serif; font-weight: 400; font-size: clamp(30px, 8vw, 44px);
      margin: 16px 0 8px; line-height: 1.1; letter-spacing: .02em; color: #fff;
      text-shadow: 0 0 8px var(--c), 0 0 24px var(--c);
    }
    .to { font-weight: 600; font-size: 20px; margin: 18px 0 8px; color: color-mix(in srgb, var(--c) 40%, #fff); }
    .msg { font-size: 18px; line-height: 1.6; white-space: pre-line; margin: 0 0 24px; }
    .from { font-family: "Russo One", sans-serif; font-size: 20px; color: var(--c); text-shadow: 0 0 10px var(--c); }
    .actions { margin-top: 28px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
      background: var(--c); color: #0b0b2b; box-shadow: 0 0 16px var(--c); transition: transform .15s;
    }
    button:hover { transform: translateY(-2px); }
    button.ghost { background: transparent; color: var(--c); border: 2px solid var(--c); box-shadow: none; }
    .editor { display: none; text-align: left; margin-top: 24px; border-top: 1px dashed rgba(255,255,255,.25); padding-top: 20px; }
    .editor.open { display: block; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; color: #c7c4f0; }
    input, textarea {
      width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; color: #fff;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.2);
    }
    input:focus, textarea:focus { outline: 2px solid var(--c); outline-offset: 1px; }
    textarea { min-height: 90px; resize: vertical; }
    input[type=color] { height: 42px; padding: 2px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .link { margin-top: 16px; font-size: 13px; word-break: break-all; background: rgba(0,0,0,.35); padding: 10px; border-radius: 10px; color: #c7c4f0; }
    .confetti { position: fixed; top: -40px; z-index: 2; font-size: 24px; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
    /* письмо-конверт */
    .mail {
      position: relative; z-index: 1; display: grid; justify-items: center; gap: 22px;
      cursor: pointer; transition: transform .6s, opacity .6s; -webkit-tap-highlight-color: transparent;
    }
    .mail.gone { transform: scale(1.4); opacity: 0; pointer-events: none; }
    .mail-hint {
      font-family: "Russo One", sans-serif; font-size: clamp(18px, 5vw, 24px); text-align: center; color: #fff;
      text-shadow: 0 0 10px var(--c); animation: pulse 1.6s ease-in-out infinite;
    }
    .mail-hint small { display: block; margin-top: 6px; font-family: "Exo 2", sans-serif; font-size: 15px; color: #c7c4f0; text-shadow: none; }
    @keyframes pulse { 50% { opacity: .55; } }
    .mail-hint { transition: opacity .3s; }
    .mail.open .mail-hint { animation: none; opacity: 0; }
    .envelope {
      position: relative; width: min(340px, 84vw); aspect-ratio: 3 / 2; perspective: 900px;
      animation: hover 3s ease-in-out infinite; filter: drop-shadow(0 0 24px color-mix(in srgb, var(--c) 55%, transparent));
    }
    @keyframes hover { 50% { transform: translateY(-10px) rotate(-1.5deg); } }
    .mail.open .envelope { animation: none; }
    .env-back, .env-front, .env-flap { position: absolute; inset: 0; border-radius: 12px; }
    .env-back { background: color-mix(in srgb, var(--c) 45%, #0b0b2b); }
    .env-front {
      z-index: 3; border-radius: 0 0 12px 12px;
      background: linear-gradient(160deg, color-mix(in srgb, var(--c) 75%, #0b0b2b), color-mix(in srgb, var(--c) 50%, #0b0b2b));
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
    }
    .env-flap {
      z-index: 4; transform-origin: top; border-radius: 12px 12px 0 0;
      background: linear-gradient(180deg, color-mix(in srgb, var(--c) 90%, #fff), var(--c));
      clip-path: polygon(0 0, 100% 0, 50% 62%);
      transition: transform .7s ease-in-out, z-index 0s .35s;
    }
    .mail.open .env-flap { transform: rotateX(180deg); z-index: 1; }
    .seal {
      position: absolute; z-index: 5; left: 50%; top: 62%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
      display: grid; place-items: center; border-radius: 50%; font-size: 26px;
      background: radial-gradient(circle at 35% 35%, #ff8a8a, #c81e3a); box-shadow: 0 4px 12px rgba(0,0,0,.5);
      transition: transform .4s, opacity .4s;
    }
    .mail.open .seal { transform: scale(0) rotate(90deg); opacity: 0; }
    .env-letter {
      position: absolute; z-index: 2; left: 7%; right: 7%; top: 8%; bottom: 6%; border-radius: 8px;
      background: linear-gradient(#fdfcff, #e9e6ff); padding: 14px; color: #2a2550; text-align: center;
      font-family: "Russo One", sans-serif; font-size: 15px; overflow: hidden;
      transition: transform .9s cubic-bezier(.3,1.3,.5,1) .55s;
    }
    .env-letter::after { content: ""; display: block; height: 2px; margin: 10px 18%; background: color-mix(in srgb, var(--c) 60%, #fff); box-shadow: 0 10px 0 #d9d4ff, 0 20px 0 #d9d4ff; }
    .mail.open .env-letter { transform: translateY(-62%); }
    .env-to {
      position: absolute; z-index: 4; left: 0; right: 0; bottom: 14%; text-align: center; pointer-events: none;
      font-family: "Russo One", sans-serif; font-size: 15px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6);
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="planet"></div>
  <div class="moon"></div>

  <div class="mail" id="mail" role="button" tabindex="0" aria-label="Открыть письмо">
    <div class="mail-hint">📡 Тебе письмо из космоса!<small>Нажми, чтобы открыть</small></div>
    <div class="envelope">
      <div class="env-back"></div>
      <div class="env-letter" id="env-letter"></div>
      <div class="env-front"></div>
      <div class="env-to" id="env-to"></div>
      <div class="env-flap"></div>
      <div class="seal" id="seal"></div>
    </div>
  </div>

  <main class="card" id="card">
    <div class="emoji" id="emoji"></div>
    <h1 id="title"></h1>
    <p class="to" id="to"></p>
    <p class="msg" id="msg"></p>
    <p class="from" id="from"></p>

    <div class="actions">
      <button id="party">✨ Звездопад!</button>
      <button class="ghost" id="toggle">✏️ Сделать свою</button>
    </div>

    <form class="editor" id="editor">
      <label for="f-title">Заголовок</label><input id="f-title" data-key="title">
      <label for="f-to">Кому</label><input id="f-to" data-key="to">
      <label for="f-message">Поздравление</label><textarea id="f-message" data-key="message"></textarea>
      <label for="f-from">От кого</label><input id="f-from" data-key="from">
      <div class="row">
        <div><label for="f-color">Цвет</label><input type="color" id="f-color" data-key="color"></div>
        <div><label for="f-emoji">Эмодзи</label><input id="f-emoji" data-key="emoji"></div>
      </div>
      <div class="actions"><button type="button" id="copy">📋 Скопировать ссылку</button></div>
      <div class="link" id="link"></div>
    </form>
  </main>

  <script src="config.js"></script>
  <script>
    const KEYS = ["title", "to", "message", "from", "color", "emoji"];
    const params = new URLSearchParams(location.search);
    // данные: сначала из config.js, потом перезаписываются параметрами ссылки
    const card = { ...CARD };
    KEYS.forEach(k => { if (params.has(k)) card[k] = params.get(k); });
    if (params.has("text")) card.message = params.get("text");

    const $ = id => document.getElementById(id);

    function render() {
      document.documentElement.style.setProperty("--c", card.color);
      document.title = card.title;
      $("emoji").textContent = card.emoji;
      $("title").textContent = card.title;
      $("to").textContent = card.to ? card.to + "," : "";
      $("msg").textContent = card.message;
      $("from").textContent = card.from ? "— " + card.from : "";
      $("seal").textContent = card.emoji;
      $("env-letter").textContent = card.title;
      $("env-to").textContent = card.to ? "Для: " + card.to : "";
    }

    // открытие письма: печать слетает, клапан открывается, письмо выезжает, потом появляется открытка
    function openMail() {
      const mail = $("mail");
      if (mail.classList.contains("open")) return;
      mail.classList.add("open");
      setTimeout(() => mail.classList.add("gone"), 1700);
      setTimeout(() => {
        mail.remove();
        $("card").classList.add("show");
        confetti();
      }, 2200);
    }
    $("mail").addEventListener("click", openMail);
    $("mail").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openMail(); });

    function shareLink() {
      const p = new URLSearchParams();
      KEYS.forEach(k => { if (card[k] !== CARD[k]) p.set(k, card[k]); });
      const q = p.toString();
      return location.origin + location.pathname + (q ? "?" + q : "");
    }

    function confetti(n = 40) {
      const symbols = [card.emoji, "⭐", "🌟", "🪐", "☄️", "✨"];
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span");
        s.className = "confetti";
        s.textContent = symbols[i % symbols.length];
        s.style.left = Math.random() * 100 + "vw";
        s.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
        s.style.animationDelay = Math.random() * 1.5 + "s";
        document.body.appendChild(s);
        s.addEventListener("animationend", () => s.remove());
      }
    }

    // звёздное небо: мерцающие звёзды и падающие кометы
    const sky = $("sky"), ctx = sky.getContext("2d");
    let stars = [], comets = [];
    function resize() {
      sky.width = innerWidth * devicePixelRatio;
      sky.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      stars = Array.from({ length: Math.round(innerWidth * innerHeight / 2500) }, () => ({
        x: Math.random() * innerWidth, y: Math.random() * innerHeight,
        r: Math.random() * 1.4 + .2, p: Math.random() * Math.PI * 2, s: Math.random() * .03 + .005,
      }));
    }
    function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (const st of stars) {
        st.p += st.s;
        ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(st.p));
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
      }
      if (Math.random() < .01) comets.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight * .4, life: 1 });
      for (const c of comets) {
        c.x += 9; c.y += 4; c.life -= .02;
        const g = ctx.createLinearGradient(c.x, c.y, c.x - 90, c.y - 40);
        g.addColorStop(0, "#fff"); g.addColorStop(1, "transparent");
        ctx.globalAlpha = Math.max(c.life, 0);
        ctx.strokeStyle = g; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x - 90, c.y - 40); ctx.stroke();
      }
      comets = comets.filter(c => c.life > 0);
      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    addEventListener("resize", resize);
    resize();
    frame();

    // редактор
    document.querySelectorAll("[data-key]").forEach(el => {
      el.value = card[el.dataset.key];
      el.addEventListener("input", () => {
        card[el.dataset.key] = el.value;
        render();
        $("link").textContent = shareLink();
      });
    });
    $("toggle").onclick = () => {
      $("editor").classList.toggle("open");
      $("link").textContent = shareLink();
    };
    $("copy").onclick = async () => {
      const url = shareLink();
      try { await navigator.clipboard.writeText(url); $("copy").textContent = "✅ Скопировано!"; }
      catch { prompt("Скопируй ссылку:", url); }
      setTimeout(() => $("copy").textContent = "📋 Скопировать ссылку", 2000);
    };
    $("party").onclick = () => confetti();

    render();
  </script>
</body>
</html>
