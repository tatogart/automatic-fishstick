<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Открытка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --c: #ff6f91; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 16px; font-family: "Nunito", sans-serif; color: #2b2b2b;
      background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--c) 35%, #fff), color-mix(in srgb, var(--c) 80%, #000) 120%);
      overflow-x: hidden;
    }
    .card {
      position: relative; width: min(480px, 100%); background: #fffdf9;
      border-radius: 24px; padding: 40px 28px 32px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.25); border-top: 10px solid var(--c);
      animation: pop .7s cubic-bezier(.2,1.4,.4,1) both;
    }
    @keyframes pop { from { transform: scale(.6) rotate(-4deg); opacity: 0; } }
    .emoji { font-size: 64px; line-height: 1; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px) rotate(6deg); } }
    h1 { font-family: "Caveat", cursive; font-size: clamp(40px, 10vw, 56px); margin: 12px 0 8px; color: var(--c); line-height: 1.05; }
    .to { font-weight: 700; font-size: 20px; margin: 16px 0 8px; }
    .msg { font-size: 18px; line-height: 1.55; white-space: pre-line; margin: 0 0 24px; }
    .from { font-family: "Caveat", cursive; font-size: 28px; color: var(--c); }
    .actions { margin-top: 28px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 18px;
      cursor: pointer; background: var(--c); color: #fff;
    }
    button.ghost { background: transparent; color: var(--c); border: 2px solid var(--c); }
    .editor { display: none; text-align: left; margin-top: 24px; border-top: 1px dashed #ccc; padding-top: 20px; }
    .editor.open { display: block; }
    label { display: block; font-size: 14px; font-weight: 700; margin: 12px 0 4px; }
    input, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #ccc; border-radius: 10px; }
    textarea { min-height: 90px; resize: vertical; }
    input[type=color] { height: 42px; padding: 2px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .link { margin-top: 16px; font-size: 13px; word-break: break-all; background: #f4f4f4; padding: 10px; border-radius: 10px; }
    .confetti { position: fixed; top: -40px; font-size: 24px; pointer-events: none; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" id="emoji"></div>
    <h1 id="title"></h1>
    <p class="to" id="to"></p>
    <p class="msg" id="msg"></p>
    <p class="from" id="from"></p>

    <div class="actions">
      <button id="party">Ещё конфетти!</button>
      <button class="ghost" id="toggle">✏️ Сделать свою</button>
    </div>

    <form class="editor" id="editor">
      <label for="f-title">Заголовок</label><input id="f-title" data-key="title">
      <label for="f-to">Кому</label><input id="f-to" data-key="to">
      <label for="f-message">Поздравление</label><textarea id="f-message" data-key="message"></textarea>
      <label for="f-from">От кого</label><input id="f-from" data-key="from">
      <div class="row">
        <div><label for="f-color">Цвет</label><input type="color" id="f-color" data-key="color"></div>
        <div><label for="f-emoji">Эмодзи</label><input id="f-emoji" data-key="emoji"></div>
      </div>
      <div class="actions"><button type="button" id="copy">📋 Скопировать ссылку</button></div>
      <div class="link" id="link"></div>
    </form>
  </main>

  <script src="config.js"></script>
  <script>
    const KEYS = ["title", "to", "message", "from", "color", "emoji"];
    const params = new URLSearchParams(location.search);
    // данные: сначала из config.js, потом перезаписываются параметрами ссылки
    const card = { ...CARD };
    KEYS.forEach(k => { if (params.has(k)) card[k] = params.get(k); });
    if (params.has("text")) card.message = params.get("text");

    const $ = id => document.getElementById(id);

    function render() {
      document.documentElement.style.setProperty("--c", card.color);
      document.title = card.title;
      $("emoji").textContent = card.emoji;
      $("title").textContent = card.title;
      $("to").textContent = card.to ? card.to + "," : "";
      $("msg").textContent = card.message;
      $("from").textContent = card.from ? "— " + card.from : "";
    }

    function shareLink() {
      const p = new URLSearchParams();
      KEYS.forEach(k => { if (card[k] !== CARD[k]) p.set(k, card[k]); });
      const q = p.toString();
      return location.origin + location.pathname + (q ? "?" + q : "");
    }

    function confetti(n = 40) {
      const symbols = [card.emoji, "✨", "🎊", "💖", "⭐"];
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span");
        s.className = "confetti";
        s.textContent = symbols[i % symbols.length];
        s.style.left = Math.random() * 100 + "vw";
        s.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
        s.style.animationDelay = Math.random() * 1.5 + "s";
        document.body.appendChild(s);
        s.addEventListener("animationend", () => s.remove());
      }
    }

    // редактор
    document.querySelectorAll("[data-key]").forEach(el => {
      el.value = card[el.dataset.key];
      el.addEventListener("input", () => {
        card[el.dataset.key] = el.value;
        render();
        $("link").textContent = shareLink();
      });
    });
    $("toggle").onclick = () => {
      $("editor").classList.toggle("open");
      $("link").textContent = shareLink();
    };
    $("copy").onclick = async () => {
      const url = shareLink();
      try { await navigator.clipboard.writeText(url); $("copy").textContent = "✅ Скопировано!"; }
      catch { prompt("Скопируй ссылку:", url); }
      setTimeout(() => $("copy").textContent = "📋 Скопировать ссылку", 2000);
    };
    $("party").onclick = () => confetti();

    render();
    confetti();
  </script>
</body>
</html>
